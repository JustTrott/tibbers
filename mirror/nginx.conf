# The tibbers u.gg mirror: static files, gzip on disk, nothing dynamic.
#
# Files are stored exactly as u.gg sent them, gzip-compressed, as
# `<path>.json.gz` with no plain `<path>.json` beside them. `gzip_static
# always` serves the .gz for a request to the .json whatever the client's
# Accept-Encoding says, and `gunzip on` decompresses for the rare client that
# cannot take gzip. tibbers always asks for gzip.
#
# Installed by install.sh as /etc/nginx/sites-available/tibbers-mirror.
# TLS is added afterwards by certbot --nginx, which rewrites this file.

server {
    listen 80;
    listen [::]:80;
    server_name data.tibbers.lol;

    root /var/lib/tibbers-mirror/public;

    access_log /var/log/nginx/tibbers-mirror.access.log;
    error_log  /var/log/nginx/tibbers-mirror.error.log;

    gzip_static always;
    gunzip on;
    etag on;

    # The files never change under one URL between syncs, and clients expire
    # on the schedule status.json advertises; this is only for intermediaries.
    add_header Cache-Control "public, max-age=300" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = / {
        return 204;
    }

    location = /status.json {
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location ~ \.json$ {
        types { application/json json; }
        default_type application/json;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
