# The lobby relay. LOBBY.md, "The relay", is the design.
#
#   npm run dev        local, on 127.0.0.1:8787; no account needed
#   npm run check      types and a compile
#   npm run deploy     to lobby.tibbers.lol -- the user's call
name = "tibbers-lobby"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# One address only. The per-IP rate limit is a rule on the tibbers.lol zone,
# and a workers.dev or preview URL would be a way round it.
workers_dev = false
preview_urls = false
routes = [{ pattern = "lobby.tibbers.lol", custom_domain = true }]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# SQLite-backed because that is the only kind the free plan offers. A room
# never writes to its storage.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
