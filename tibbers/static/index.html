/* Place every tile by its signed distance from the chosen one, the short way
   round the ring -- and then turn the ring, rather than move the tiles.

   Each tile sits at a slot on a line of slots that runs on for as long as
   the ring is turned, and the track is slid so that the chosen tile's slot
   is in the middle. A step of one changes the middle by one slot, which
   leaves every tile exactly where it was and moves the whole track by one
   stride: one transition, on one element, so the rail cannot come apart --
   every tile travels the same distance, in the same time, on the same
   curve, whatever the step and however many tiles there are.

   Exactly one tile is left behind by a step, and it comes round: its slot
   moves by a whole ring, a jump made through `left`, which nothing
   transitions. It happens half a ring from the middle -- past the end of
   the viewport for any champion whose skins outnumber the tiles on screen,
   so the eye never catches it. */
let SPIN = null, STRIDE = 0;

function mark(place) {
  const track = $('track');
  const tiles = [...track.querySelectorAll('.tile')];
  const n = tiles.length;
  if (!n) return;
  const st = getComputedStyle(document.documentElement);
  const w = parseFloat(st.getPropertyValue('--tile-w'));
  const gap = parseFloat(st.getPropertyValue('--tile-gap'));
  const stride = w + gap;
  let at = tiles.findIndex(el => parseInt(el.dataset.skin, 10) === SEL);
  if (at < 0) at = 0;
  /* A rail that has just been drawn, or one whose tiles have changed size
     under a breakpoint, is put where it belongs instead of sliding there
     from wherever the last one stood. */
  const settle = place === true || SPIN === null || stride !== STRIDE;
  STRIDE = stride;
  /* SPIN is the chosen tile's slot: `at` with the turns of the ring counted
     in, moved the short way round, so a step is one stride even when it was
     the step that came round the end. */
  if (settle) SPIN = at;
  else {
    const turn = (((at - SPIN) % n) + n) % n;
    SPIN += turn > n / 2 ? turn - n : turn;
  }
  tiles.forEach((el, i) => {
    el.setAttribute('aria-current', String(i === at));
    let d = i - at;
    if (d > n / 2) d -= n;
    if (d <= -n / 2) d += n;
    el.style.left = `calc(50% + ${(SPIN + d) * stride}px)`;
  });
  if (settle) track.style.transition = 'none';
  track.style.transform = `translateX(${-SPIN * stride}px)`;
  /* Read the layout back, so the placement above is the track's settled
     position and the next step is a step away from it and not a slide in
     from wherever the tiles were drawn. */
  if (settle) { void track.offsetWidth; track.style.transition = ''; }
  const few = usable().length < 2;
  $('prev').disabled = few;
  $('next').disabled = few;
}

/* A skin tile asks for the skin with whatever chroma is remembered for it,
   which only the app knows: CHROMA is left undefined, the request carries no
   chromaId, and the answer says which chroma was restored. The base swatch on
   the strip is the explicit "no chroma", a null that is sent. */
function select(id) { SEL = id; CHROMA = undefined; PEEK = null; STRIP_SIG = ''; queue(); paint(); mark(); }
/* Round the ring: off the last skin comes the base, off the base the newest. */
function step(delta) {
  const list = usable();
  if (list.length < 2) return;
  const at = Math.max(0, list.findIndex(k => k.id === SEL));
  select(list[(at + delta + list.length) % list.length].id);
}
$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);

async function queue() {
  const asked = SEL;
  let r = null;
  try {
    r = await (await fetch('/api/select', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      // The base skin is a request for nothing: no mod, nothing armed.
      body: JSON.stringify({ skinId: isBaseId(SEL) ? null : SEL, chromaId: CHROMA }),
    })).json();
  } catch (e) { return; }
  /* Still on the same skin with the chroma left to the app: show the one
     it chose. A click that came in meanwhile has its own answer coming. */
  if (r && r.ok && SEL === asked && CHROMA === undefined) {
    CHROMA = r.selectedChromaId || null; STRIP_SIG = ''; paint();
  }
}

/* ═══ tabs, build and counters ══════════════════════════════════════ */

let VIEW = 'skin', GUIDE_SIG = '', LANE_SIG = '', COUNT_SIG = '', HAS = false;

/* The rail sits outside the views (it is the skin page's footer, not its
   content), so both a state poll and a tab switch decide whether it shows.
   Leaving it to the poll alone left it over the build page for up to one
   poll, and missing from the skin page for the same. */
function placeRail() { $('rail').hidden = !(HAS && VIEW === 'skin'); }

/* ═══ the tab set ═══════════════════════════════════════════════════
   A property of the mode, not a constant. The server derives which tabs a
   mode earns (modes.py) and sends them with the queue; nothing here holds a
   list of three. A tab that could only ever render an empty state is not
   sent at all, because it would teach that tabs are allowed to be dead. */

let TABS = [{ key: 'skin', label: 'Skin' }];
/* The server's label is the fallback: a tab this page has no word for keeps
   the name it arrived with, rather than its key. */
const tabLabel = tb => ('tab.' + tb.key) in T.en ? t('tab.' + tb.key) : tb.label;
const VIEW_IDS = ['skin', 'build', 'counters', 'tiers', 'augments', 'items'];
const viewId = key => 'view-' + key;

function tabsOf(s) {
  const list = (s.queue || {}).tabs;
  return (Array.isArray(list) && list.length) ? list : [{ key: 'skin', label: 'Skin' }];
}

function paintTabs(list) {
  const named = list.map(tb => ({ key: tb.key, label: tabLabel(tb) }));
  const sig = named.map(tb => tb.key + ':' + tb.label).join(',');
  const bar = $('tabset');
  if (bar.dataset.sig === sig) return false;
  bar.dataset.sig = sig;
  TABS = named;
  bar.innerHTML = named.map((tb, i) => `
    <button class="tab ${tb.key === VIEW ? 'on' : ''}" data-view="${esc(tb.key)}"
            title="${esc(tb.label)} (${i + 1})">${esc(tb.label)}</button>`).join('');
  for (const b of bar.querySelectorAll('.tab')) b.onclick = () => showView(b.dataset.view);
  // The view that was open may not exist in this mode any more.
  if (!list.some(tb => tb.key === VIEW)) showView(list[0].key);
  return true;
}

/* Which page the app opens on, per moment rather than per session.

   Champ select starts on Skin because picking one is what the window is
   for and the timer is running. When the game starts the skin is already
   applied and the decision has moved on: in Arena and Mayhem that means
   augments, which are chosen several times a match. Only ever moved on a
   real transition, so it never fights a tab the user just pressed. */
let PHASE_WAS = null;
function followPhase(s) {
  const now = s.phase || null;
  if (now === PHASE_WAS) return;
  const before = PHASE_WAS;
  PHASE_WAS = now;
  const has = key => TABS.some(tb => tb.key === key);
  if (now === 'ChampSelect' && before !== 'ChampSelect') showView('skin');
  else if (now === 'InProgress' && has('augments')) showView('augments');
}

function moveTabline() {
  const on = document.querySelector('.tab.on');
  const line = $('tabline');
  if (!on || !line) return;
  // Measured rather than guessed: the labels are different widths, and a
  // fixed step would drift.
  line.style.width = (on.offsetWidth - 20) + 'px';
  line.style.transform = `translateX(${on.offsetLeft + 10}px)`;
}

function showView(name) {
  const changed = VIEW !== name;
  VIEW = name;
  for (const b of document.querySelectorAll('.tab'))
    b.classList.toggle('on', b.dataset.view === name);
  moveTabline();
  for (const key of VIEW_IDS) {
    const el = $(viewId(key));
    if (el) el.hidden = key !== name;
  }
  placeRail();
  // The rail measures nothing while display:none, so the selected tile is
  // put back in the middle once it is on screen again -- put, not slid: a
  // tab is not a step.
  if (changed && name === 'skin') requestAnimationFrame(() => mark(true));
  if (changed) {
    // Replay the incoming view's entrance, which is otherwise a one-shot on
    // load. Only the incoming one: restarting the outgoing view's animation
    // as it leaves is a frame of it fading back in over the new page.
    const el = $(viewId(name));
    if (el) { el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; }
  }
  // The splash is the skin page's subject; elsewhere it is only a backdrop.
  document.querySelector('.splash').style.opacity = name === 'skin' ? '' : '.35';
  // The patch only governs the build and counter pages; on the skin page it
  // is furniture with nothing to steer.
  $('patch').classList.toggle('offpage', name === 'skin');
}

const pct = v => (v === undefined || v === null) ? '' : v.toFixed(1) + '%';
const num = v => (v || 0).toLocaleString(LANG);
/* The percent sign travels with its figure and is drawn smaller, so a column
   of numbers still reads as a column while every one of them stays labelled. */
const fig = (v, places = 1) => (v === undefined || v === null) ? '<i>&mdash;</i>'
  : `${v.toFixed(places)}<i>%</i>`;

/* A content signature, so a repaint happens when the data changes and never
   on a poll that changed nothing. Hashed rather than compared, because the
   Arena payload is 45 augments and 60 item rows and keeping a copy of it to
   diff against would cost more than rebuilding.

   Built over the whole object rather than a hand-picked tuple: the old
   signature listed six fields, none of which mentioned the mode or anything
   inside the Arena payload, so an Arena response arriving while the state
   was already `ready` repainted nothing. */
function hash(text) {
  let h = 5381;
  for (let i = 0; i < text.length; i++) h = ((h * 33) ^ text.charCodeAt(i)) >>> 0;
  return h.toString(36);
}
const sigOf = (...parts) => parts.map(p =>
  typeof p === 'object' ? hash(JSON.stringify(p) || '') : String(p)).join('|');

/* Every data page has the same two empty states: still reading, or read and
   there was nothing there. Written in one place so five pages cannot drift
   into five voices for the same two moments. Callers pass text that is
   already safe to insert. */
function noteEmpty(box, loading, subject, title, text) {
  $(box).innerHTML = '<div class="note-empty">' + (loading
    ? `<span>${esc(t('reading', { what: t(subject) }))}</span>`
    : `${title ? `<b>${title}</b>` : ''}<span>${text}</span>`) + '</div>';
}

function bandHTML(title, block, note) {
  const wr = block && block.winRate ? `<span class="wr">${pct(block.winRate)}</span>` : '';
  const n  = block && block.matches ? `<span class="n">${plural(block.matches, 'games')}</span>`
    : (note ? `<span class="n">${esc(note)}</span>` : '');
  return `<div class="band"><h2>${title}</h2>${wr}${n}</div>`;
}

/* The headline for the matchup on screen: win rate, the games behind it, and
   the gold swing at fifteen. Everything here belongs to the pairing the row
   already names, which is why it lives on the row rather than in the sheet. */
function laneNote(s) {
  const g = s.guide || {};
  const foe = (s.enemies || []).find(e => e.championId === g.opponentId);
  if (!foe) return `<span class="note">${esc(t('lane.assumed'))}</span>`;
  const m = g.matchup;
  if (!m || g.state !== 'ready') return '';
  const wr = (m.overall || {}).winRate;
  const seen = (s.guide.against || []).find(a => a.championId === g.opponentId) || {};
  const bits = [esc(foe.name)];
  if (wr !== undefined && wr !== null)
    bits.push(t('lane.over', { wr: `<b>${pct(wr)}</b>`, games: plural(m.matches, 'games') }));
  if (seen.goldAt15 !== undefined && seen.goldAt15 !== null) {
    const g15 = Math.round(seen.goldAt15);
    const gold = t('lane.gold', { g: num(Math.abs(g15)),
                                  dir: t(g15 < 0 ? 'lane.behind' : 'lane.ahead') });
    bits.push(`<b>${esc(gold)}</b> ${esc(t('lane.at15'))}`);
  }
  // A win rate over a few dozen games says nothing, so the count that makes
  // it doubtful is the part that is coloured, not the rate itself.
  if (m.thin) bits.push(`<b class="warn">${esc(t('lane.thin'))}</b>`);
  return `<span class="note">${bits.join(' &middot; ')}</span>`;
}

function renderLane(s, into, note) {
  const foes = (s.enemies || []).filter(e => e.championId);
  const sig = foes.map(e => e.championId).join(',') + '|' + s.opponentId
    + '|' + into.id + '|' + note;
  if (sig === into.dataset.sig) return;
  into.dataset.sig = sig;

  const lbl = `<span class="lbl">${esc(t('lane.lbl'))}</span>`;
  if (!foes.length) {
    into.innerHTML = lbl + `<span class="note">${esc(t('lane.none'))}</span>`;
    return;
  }
  into.innerHTML = lbl + foes.map(e => `
    <button class="foe" data-champ="${e.championId}"
            aria-pressed="${e.championId === s.opponentId}"
            title="${t('foe.title', { name: esc(e.name) })}">
      <img src="${esc(art(e.icon))}" alt="">
    </button>`).join('') + note;
  for (const b of into.querySelectorAll('.foe')) {
    b.onclick = () => fetch('/api/opponent', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ championId: parseInt(b.dataset.champ, 10) }),
    });
  }
}

/* The keystone is the first row's picked perk, which the payload already
   marks, so the tree draws itself from `picked` alone. */
function treeHTML(tree) {
  const rows = (tree.rows || []).map((row, i) => `<div class="row">` + row.map(p => `
    <span class="perk ${p.picked ? 'on' : ''} ${i === 0 ? 'key' : ''}"
          title="${esc(p.name)}"><img src="${esc(art(p.icon))}" alt=""></span>`
  ).join('') + `</div>`).join('');
  return `<div class="tree">
    <div class="head"><img src="${esc(art(tree.icon))}" alt=""><span>${esc(tree.name)}</span></div>
    ${rows}</div>`;
}

// Which of the two builds is on screen. Both arrive together, so this is a
// pure display choice with nothing to fetch.
// The general build is the default: it is what the champion wants, on the
// larger sample. The matchup (vs this opponent) is one click away for when its
// count is worth trusting over the general one.
let BUILD_MODE = 'general';

function renderGuide(s) {
  const g = s.guide || {}, box = $('guide');
  const q = s.queue || {};
  // Mode plus a hash of the payload itself. Anything that changes what the
  // page should say now changes the signature.
  const sig = sigOf(q.kind, BUILD_MODE, g);
  if (sig === GUIDE_SIG) return;
  GUIDE_SIG = sig;
  const stamp = [q.label && q.kind !== 'rift' ? q.label : '',
                 q.borrowed ? t('stamp.borrowed') : ''];
  $('stamp').textContent = stamp.filter(Boolean).join(' · ');
  // Mayhem borrows its build and nothing else, so it says which half.
  $('stamp').title = q.borrowed
    ? t(q.augments ? 'stamp.title.build' : 'stamp.title',
        { label: q.label,
          src: t(q.kind === 'mayhem' ? 'src.aram' : 'src.rift') }) : '';
  paintPatch(g.patch);

  if (!s.championId) {
    noteEmpty('guide', false, '', esc(t('guide.nochamp')), esc(t('guide.nochamp.text')));
    return;
  }
  if (g.state === 'unsupported') {
    noteEmpty('guide', false, '', esc(g.label || t('guide.thismode')),
              esc(t('guide.unsupported')));
    return;
  }
  if (g.state === 'loading' || !g.state) {
    noteEmpty('guide', true, 'subj.build');
    return;
  }
  if (g.state !== 'ready') {
    noteEmpty('guide', false, '', esc(t('guide.nodata')),
              esc(g.error || t('guide.nodata.text')));
    return;
  }

  // Arena spends its tabs differently: augments, items and the roster each
  // have their own page, so there is no combined build sheet to draw.
  if (g.mode === 'arena') return;

  // The matchup build unless there is no opponent, or it was asked for.
  const opponent = (s.enemies || []).find(e => e.championId === g.opponentId);
  // A boolean, not the matchup object: it is written into aria-pressed.
  const useMatchup = BUILD_MODE === 'matchup' && !!g.matchup;
  const b = useMatchup ? g.matchup : (g.general || {});

  // The counts stay in the labels: choosing between these two is a judgement
  // about sample size, and the label is where that judgement is made.
  const toggle = !g.matchup ? '' : `
    <div class="modes">
      <button class="mode" aria-pressed="${!useMatchup}" data-mode="general">${esc(t('mode.general'))}
        <em>${num((g.general || {}).matches)}</em></button>
      <button class="mode" aria-pressed="${useMatchup}" data-mode="matchup">
        ${t('mode.vs', { name: esc(opponent ? opponent.name : t('vs.opponent')) })}
        <em>${num(g.matchup.matches)}</em></button>
    </div>`;

  const runes = b.runes || {}, sk = b.skills || {}, sp = b.spells || {};
  const shards = (b.shards || []).map(x =>
    `<span class="shard" title="${esc(x.name)}"><img src="${esc(art(x.icon))}" alt=""></span>`).join('');

  const skillRows = (sk.rows || []).map(r => {
    const cells = Array.from({length: 18}, (_, i) => {
      const on = (r.levels || []).includes(i + 1);
      return `<span class="lv ${on ? 'on' : ''}">${on ? i + 1 : ''}</span>`;
    }).join('');
    return `<div class="skill"><img src="${esc(art(r.icon))}" alt="" title="${esc(r.name)}">
      <span class="key">${r.key}</span><span class="levels">${cells}</span></div>`;
  }).join('');

  const itemRow = (block, cls) => (block ? block.items : []).map((i, n) => `
    ${n ? '<span class="arrowto">&rsaquo;</span>' : ''}
    <span class="it ${cls}" title="${esc(i.name)}"><img src="${esc(art(i.icon))}" alt=""></span>`
  ).join('');

  // A sample this thin is the reason to distrust the rate above it, so the
  // count is what carries the warning colour.
  const THIN = 1000;

  /* Rift: icons, because there is no room for names and a six-item core is
     common knowledge. The figures gain the percent sign and the game count
     they were missing, so a 64.86% over 37 games cannot read as the best
     option on the row. */
  const optBlock = (cap, rows) => !rows || !rows.length ? '' : `
    <div class="opt"><span class="cap">${cap}</span><div class="picks">` +
    rows.slice(0, 2).map(o => `<span class="pick ${o.matches < THIN ? 'thin' : ''}"
        title="${esc(o.name)} &mdash; ${plural(o.matches, 'games')}">
      <span class="it small"><img src="${esc(art(o.icon))}" alt=""></span>
      <span class="wr">${fig(o.winRate, 2)}</span>
      <span class="n">${num(o.matches)}</span></span>`).join('') + `</div></div>`;

  /* ARAM: the same options with their names, paid for by the lane row and
     the matchup switch this mode does not draw. An unnamed item is the same
     failure as an unnamed augment, and ARAM item choices are the less
     rehearsed of the two. */
  const namedOpts = (cap, rows) => !rows || !rows.length ? '' : `
    <div class="aoptrow"><span class="cap">${cap}</span>` +
    rows.slice(0, 2).map(o => `<span class="aopt ${o.matches < THIN ? 'thin' : ''}">
      <span class="it small" title="${esc(o.name)}"><img src="${esc(art(o.icon))}" alt=""></span>
      <span class="nm">${esc(o.name)}</span>
      <span class="wr">${fig(o.winRate, 2)}</span>
      <span class="n">${num(o.matches)}<i>${esc(pluralForm(o.matches, 'games'))}</i></span></span>`).join('') + `</div>`;

  const wide = q.roles === false;
  /* Some modes hand runes out rather than letting you pick them -- Mayhem
     gives augments in their place. Drawing the tree there would be a page
     inviting a choice the game does not offer, so the block goes and the
     rest of the sheet takes the width back. */
  const picksRunes = q.runes !== false;

  freshen(box);
  box.innerHTML = toggle + `
    <div class="split${picksRunes ? '' : ' solo'}">
      ${picksRunes ? `<section class="block">
        ${bandHTML(esc(t('runes')), runes)}
        <div class="trees">
          ${runes.primary ? treeHTML(runes.primary) : ''}
          ${runes.secondary ? treeHTML(runes.secondary) : ''}
        </div>
        <div class="shards">${shards}</div>
      </section>` : ''}
      <section class="block">
        ${bandHTML(esc(t('skills')), sk)}
        <div class="duo">
          <div class="spells">${(sp.spells || []).map(x =>
            `<img src="${esc(art(x.icon))}" alt="" title="${esc(x.name)}">`).join('')}</div>
          <div class="prio">${(sk.priority || []).join(' &rsaquo; ')}</div>
        </div>
        <div class="skills">${skillRows}</div>
      </section>
    </div>
    <section class="block">
      ${bandHTML(esc(t('items')), b.core)}
      ${wide ? `
      <div class="items">${itemRow(b.start, 'small')}
        <span class="arrowto sep">|</span>${itemRow(b.core, '')}</div>
      <div class="aopts">
        ${namedOpts(esc(t('opt.fourth')), b.fourth)}${namedOpts(esc(t('opt.fifth')), b.fifth)}
        ${namedOpts(esc(t('opt.sixth')), b.sixth)}
      </div>` : `
      <div class="igrid">
        <div class="items">${itemRow(b.start, 'small')}
          <span class="arrowto sep">|</span>${itemRow(b.core, '')}</div>
        <div class="opts">
          ${optBlock(esc(t('opt.4')), b.fourth)}${optBlock(esc(t('opt.5')), b.fifth)}${optBlock(esc(t('opt.6')), b.sixth)}
        </div>
      </div>`}
    </section>
    ${g.source ? `<div class="gsrc">${srcline(g.source)}</div>` : ''}`;

  for (const btn of box.querySelectorAll('.mode')) {
    btn.onclick = () => { BUILD_MODE = btn.dataset.mode; GUIDE_SIG = ''; render(LAST); };
  }
}

/* Re-arms the stagger for content that has genuinely changed. Without the
   reflow the class is already present and the animation never restarts; and
   because every caller bails on an unchanged signature, a poll that changes
   nothing never reaches here.

   The class is then taken off again, which is the whole point: a CSS
   animation restarts every time its element comes back from display:none,
   and all five of these boxes live inside a view that is hidden when another
   tab is open. Leaving `fresh` on meant every return to the build, tier
   list, augments, items or counters page replayed the entrance -- the same
   thing the rail was doing, and it reads the same way: as though the page
   were being fetched again. The longest of these animations is 190ms after a
   95ms delay, so 400ms clears them all. */
const FRESH_T = new WeakMap();
function freshen(box) {
  box.classList.remove('fresh');
  void box.offsetWidth;
  box.classList.add('fresh');
  clearTimeout(FRESH_T.get(box));
  FRESH_T.set(box, setTimeout(() => box.classList.remove('fresh'), 400));
}

/* Arena is a different game: augments are chosen three times a match and
   change how a champion works, so they lead. Placement is the measure, not
   wins -- one team of four takes first, so a 50% win rate would be absurd. */
/* ═══ Arena ════════════════════════════════════════════════════════
   Three pages, because Arena asks three questions and none of them is the
   footer of another. In champ select: is this champion worth picking. In
   game: which of the three augments on offer to take. Beside both: what to
   buy. */

let AUG_FILTER = 'all', TIER_SIG = '', AUG_SIG = '', ITEM_SIG = '';

const RARITIES = ['prismatic', 'gold', 'silver'];

/* op.gg's numeric tier, shown as op.gg publishes it. Nothing in the payload
   maps 1 to 5 onto letters, so inventing an S/A/B scale would be dressing a
   rank up as a grade it never claimed to be. The rank column carries the
   ordering that the tier only bands. */
const tierClass = n => n == 1 ? 'hi' : n == 2 ? 's' : n == 3 ? 'mid' : 'lo';

/* The augment letters ARE derived here, from placement, so they get the
   letter treatment. Gold is spent only on the top band, so it stays scarce. */
const bandClass = band => band === 'S+' ? 'hi' : band === 'S' ? 's'
  : band === 'A' ? 'mid' : 'lo';

/* Arena's three pages, and Mayhem's one. Mayhem borrows the augment table
   and nothing else: its build is an ordinary build sheet, and it has no
   roster page because ARAM does not let you pick. */
function renderModeViews(s) {
  const g = s.guide || {}, q = s.queue || {};
  if (q.source === 'opgg') {
    renderTiers(s, g);
    renderAugments(s, g);
    renderArenaItems(s, g);
  } else if (q.augments) {
    renderAugments(s, g);
  }
}

/* The roster, as op.gg ranks it. Sorted by rank, with the champion being
   hovered found at its own place and scrolled to, so "is this worth picking"
   is answered by position rather than by a number beside a list. */
function renderTiers(s, g) {
  const tl = g.tierList, rows = (tl || {}).champions || [];
  const sig = sigOf(s.championId, g.state, tl);
  if (sig === TIER_SIG) return;
  TIER_SIG = sig;

  $('thead').innerHTML = rows.length ? `
    <span class="tn rank">#</span><span class="tic"></span>
    <span class="tnm">${esc(t('th.champion'))}</span>
    <span class="tier">${esc(t('th.tier'))}</span>
    <span class="tn">${esc(t('th.first'))}</span><span class="tn">${esc(t('th.top3'))}</span>
    <span class="tn">${esc(t('th.place'))}</span><span class="tn">${esc(t('th.picked'))}</span>` : '';

  if (!rows.length) {
    noteEmpty('trows', g.state === 'loading', 'subj.tiers',
              esc(t('tiers.none')), esc(t('tiers.none.text')));
    $('tnote').textContent = '';
    return;
  }

  const mine = s.championId;
  freshen($('trows'));
  $('trows').innerHTML = rows.map(c => `
    <div class="trow ${c.championId === mine ? 'me' : ''}"
         ${c.championId === mine ? 'data-me="1"' : ''}
         title="${t('tiers.title', { name: esc(c.name), games: plural(c.matches, 'games'),
                                     ban: c.banRate })}">
      <span class="tn rank">${c.rank || ''}</span>
      <span class="tic round"><img src="${esc(art(c.icon))}" alt=""></span>
      <span class="tnm">${esc(c.name)}${c.championId === mine
        ? `<em>${esc(t('tiers.hovering'))}</em>` : ''}</span>
      <span class="tier ${tierClass(c.tier)}">${c.tier == null ? '' : c.tier}</span>
      <span class="tn lead">${fig(c.firstRate)}</span>
      <span class="tn dim">${fig(c.topRate)}</span>
      <span class="tn dim">${c.avgFinish == null ? '&mdash;' : c.avgFinish.toFixed(2)}</span>
      <span class="tn dim">${fig(c.pickRate)}</span>
    </div>`).join('');

  // What the columns are measured against, said once, under them.
  $('tnote').innerHTML = t('tiers.note', { n: rows.length, patch: esc(tl.patch || '') })
    + (tl.source ? ' &middot; ' + srcline(tl.source) : '');

  const row = $('trows').querySelector('[data-me]');
  if (row) row.scrollIntoView({ block: 'center' });
}

/* All of them, in one ranked table. The rarity rides a hairline on the icon
   rather than a section heading, which is what lets them share a ranking;
   the chips narrow it to the pool you are actually choosing from.

   Two modes feed this, and they know different things. Arena's letters are
   derived here from placement, so the table can show the figures they came
   from. Mayhem's arrive as letters -- u.gg publishes the bands and keeps the
   rates -- so those columns would be blank, and the space goes instead to
   the one thing Mayhem's rows do differ on: whether the letter is this
   champion's or the whole mode's. No column is ever drawn empty. */
function renderAugments(s, g) {
  const all = g.augments || [];
  const rated = (s.queue || {}).source === 'opgg';
  const sig = sigOf(g.state, AUG_FILTER, rated, all);
  if (sig === AUG_SIG) return;
  AUG_SIG = sig;

  const counts = { all: all.length };
  for (const r of RARITIES) counts[r] = all.filter(a => a.rarity === r).length;

  $('achips').innerHTML = ['all'].concat(RARITIES).map(k => `
    <button class="chip" data-rarity="${k}" aria-pressed="${AUG_FILTER === k}">
      ${esc(t(k === 'all' ? 'aug.all' : 'rarity.' + k + '.chip'))}
      <b>${counts[k] || 0}</b></button>`).join('')
    + `<span class="sort">${esc(t('aug.bytier'))}</span>`;
  for (const b of $('achips').querySelectorAll('.chip'))
    b.onclick = () => { AUG_FILTER = b.dataset.rarity; AUG_SIG = ''; render(LAST); };

  $('ahead').innerHTML = !all.length ? '' : `
    <span class="tic"></span><span class="tnm">${esc(t('th.augment'))}</span>
    <span class="tier">${esc(t('th.tier'))}</span>` + (rated ? `
    <span class="tn">${esc(t('th.first'))}</span><span class="tn">${esc(t('th.picked'))}</span>`
    : `<span class="tn wide">${esc(t('th.rankedfor'))}</span>`);

  if (!all.length) {
    noteEmpty('arows', g.state === 'loading', 'subj.augments',
              esc(t('aug.none')), esc(t(rated ? 'aug.none.text' : 'maug.none.text')));
    $('anote').textContent = '';
    return;
  }

  const rows = AUG_FILTER === 'all' ? all : all.filter(a => a.rarity === AUG_FILTER);
  freshen($('arows'));
  $('arows').innerHTML = rows.map(a => `
    <div class="trow" title="${rated ? t('aug.title', {
        name: esc(a.name), rarity: esc(t('rarity.' + a.rarity)),
        among: esc(t('rarity.' + a.rarity + '.among')),
        games: plural(a.matches, 'games'), fin: a.avgFinish, base: a.baseline })
      : t('maug.title', { name: esc(a.name), rarity: esc(t('rarity.' + a.rarity)),
        scope: esc(t(a.forChampion ? 'maug.mine.long' : 'maug.pool.long')) })}">
      <span class="tic r-${esc(a.rarity)}"><img src="${esc(art(a.icon))}" alt=""></span>
      <span class="tnm">${esc(a.name)}</span>
      ${a.tier ? `<span class="tier ${bandClass(a.tier)}">${a.tier}</span>`
        : `<span class="tier none" title="${esc(t('aug.fewgames'))}">${num(a.matches)}</span>`}
      ${rated ? `<span class="tn">${fig(a.firstRate)}</span>
      <span class="tn dim">${fig(a.pickRate)}</span>`
        : `<span class="tn wide ${a.forChampion ? '' : 'dim'}">${esc(
             t(a.forChampion ? 'maug.mine' : 'maug.pool'))}</span>`}
    </div>`).join('');

  // The letter is a claim about a pool, and the page has to say which pool.
  $('anote').innerHTML = (rated
    ? t('aug.note', { pool: esc(t(AUG_FILTER === 'all'
        ? 'aug.own' : 'rarity.' + AUG_FILTER + '.among')) })
    : t('maug.note', { mine: all.filter(a => a.forChampion).length,
                       n: all.filter(a => !a.forChampion).length,
                       patch: esc(dot(g.augmentPatch)) }))
    + (srcOf(g, rated) ? ' &middot; '
       + srcline(srcOf(g, rated), rated ? 'credit' : 'credit.ranking') : '');
}

/* Arena's whole page is one source; Mayhem's augments are a different file
   from its build, so the credit under the table is the augments' own -- and
   it credits a ranking rather than numbers, because u.gg publishes the
   letters and keeps the figures they were cut from. */
const srcOf = (g, rated) => rated ? g.source : g.augmentSource;

function renderArenaItems(s, g) {
  const items = g.arenaItems || {}, sk = g.arenaSkills || {};
  const sig = sigOf(g.state, items, sk);
  if (sig === ITEM_SIG) return;
  ITEM_SIG = sig;
  const box = $('aitems');

  if (!Object.keys(items).length) {
    noteEmpty('aitems', g.state === 'loading', 'subj.items',
              esc(t('ai.none')), esc(t('aug.none.text')));
    return;
  }

  /* Named rows, not a strip of anonymous icons. op.gg publishes builds as
     sets rather than as one recommendation, so a row that is a combination
     spells the whole combination out and carries the first item's icon. */
  const list = (rows, limit) => (rows || []).slice(0, limit).map(r => {
    const name = (r.items || []).map(i => i.name).join(' › ');
    return `<div class="aoptrow"><span class="aopt"
        title="${esc(name)} &mdash; ${plural(r.matches, 'games')}">
      <span class="it small"><img src="${esc(art(r.icon))}" alt=""></span>
      <span class="nm">${esc(name)}</span>
      <span class="wr">${fig(r.firstRate)}</span>
      <span class="n">${fig(r.pickRate)}<i>${esc(t('ai.picked'))}</i></span>
    </span></div>`;
  }).join('');

  const section = (title, note, rows, limit) => !rows || !rows.length ? '' : `
    <section class="block">${bandHTML(title, null, note)}
      <div class="aopts">${list(rows, limit)}</div></section>`;

  freshen(box);
  box.innerHTML =
    // Round 2 is the one round op.gg's data and the game's structure agree
    // on, so it is the one round this page names.
    section(esc(t('ai.prismatic')), t('ai.prismatic.note'), items.prismatic, 6)
    + section(esc(t('ai.core')), t('ai.note'), items.core, 4)
    + section(esc(t('ai.boots')), t('ai.note'), items.boots, 3)
    + section(esc(t('ai.late')), t('ai.note'), items.late, 5)
    + ((sk.priority || []).length ? `<section class="block">
        <div class="band"><h2>${esc(t('ai.skills'))}</h2>
          <span class="wr">${fig(sk.firstRate)}</span>
          <span class="n">${esc(t('ai.skills.n', { games: plural(sk.matches, 'games') }))}</span></div>
        <div class="prio">${(sk.priority || []).join(' &rsaquo; ')}</div>
      </section>` : '')
    + (g.source ? `<div class="gsrc">${srcline(g.source)}</div>` : '');
}

/* ═══ import: putting the build on screen into the client ═══════════
   The server resolves the build from the same state this page renders, so
   the only thing sent is which of the two it is showing. Everything else --
   which rune page is taken over, whether spells are in scope -- is decided
   there, and comes back as one result to display. */

let IMPORT_BUSY = false, IMPORT_SEEN = 0, SAY_TIMER = 0;

function paintToggles() {
  $('ispells').setAttribute('aria-checked',
    String(SETTINGS.import_spells !== false));
  $('iauto').setAttribute('aria-checked', String(!!SETTINGS.auto_import));
}

async function flipSetting(button, name) {
  const next = button.getAttribute('aria-checked') !== 'true';
  // Painted before the round trip: this is a switch, and a switch that waits
  // on a fetch to move reads as a broken one.
  button.setAttribute('aria-checked', String(next));
  SETTINGS[name] = next;
  try {
    const r = await (await fetch('/api/settings', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ name, value: next }),
    })).json();
    if (r && r.settings) { SETTINGS = r.settings; paintToggles(); }
  } catch (e) { loadSettings(); }
}

function noteImport(text, bad) {
  const el = $('isay');
  clearTimeout(SAY_TIMER);
  el.textContent = text;
  el.classList.toggle('bad', !!bad);
  el.classList.toggle('in', !!text);
  // A failure is read; a success is only confirmed, so it goes sooner.
  if (text) SAY_TIMER = setTimeout(() => el.classList.remove('in'),
                                   bad ? 9000 : 4500);
}

function renderImport(s) {
  const g = s.guide || {}, bar = $('ibar');
  const arena = g.mode === 'arena';
  const ready = g.state === 'ready' && !!s.championId;
  bar.hidden = !ready;
  if (!ready) return;

  // Arena publishes no runes and no spells, so the button is honest about
  // writing only the shop's item set there.
  $('igo').textContent = t(IMPORT_BUSY ? 'import.busy'
    : arena ? 'import.items' : 'import.build');
  $('igo').disabled = IMPORT_BUSY;
  $('ispells').hidden = arena;

  // Auto-import has no caller to answer, so its outcome arrives here. Only a
  // genuinely new result is shown: the same one arrives on every poll.
  const done = s.import || {};
  if (done.at && done.at !== IMPORT_SEEN) {
    IMPORT_SEEN = done.at;
    showImport(done);
  }
}

function showImport(r) {
  if (r.ok) {
    // The server names what it wrote: "spells", "items", or the rune page's
    // own name, which is data and stays as it is.
    const what = (r.done || []).map(d =>
      ('done.' + d) in T.en ? t('done.' + d) : d).join(' · ') || t('import.nothing');
    noteImport(t(r.dryRun ? 'import.would' : 'import.done', { what }), false);
  } else {
    noteImport(r.error || t('import.failed'), true);
  }
}

async function runImport() {
  if (IMPORT_BUSY) return;
  IMPORT_BUSY = true;
  $('igo').disabled = true;
  $('igo').textContent = t('import.busy');
  noteImport('', false);
  let r;
  try {
    r = await (await fetch('/api/import', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ what: 'all', mode: BUILD_MODE }),
    })).json();
  } catch (e) { r = { ok: false, error: t('import.noanswer') }; }
  IMPORT_BUSY = false;
  IMPORT_SEEN = r.at || IMPORT_SEEN;
  showImport(r);
  render(LAST);
}

$('igo').onclick = () => runImport();
$('ispells').onclick = () => flipSetting($('ispells'), 'import_spells');
$('iauto').onclick = () => flipSetting($('iauto'), 'auto_import');

/* ═══ counters ═════════════════════════════════════════════════════
   One question at a time. "What beats them" and "what beats you" are the
   same table with the subject swapped, so they are one table with a switch
   above it rather than two designs stacked down a page nobody scrolls.

   Your own champion is inserted at its true rank rather than exiled to a
   widget in the margin: "where do I actually sit" is a question about
   position, and only position answers it. */

let COUNTER_SIDE = 'them';
//: The opponent the side was last snapped for, so a manual switch to "beats
//: you" sticks -- until a better opponent is surfaced (the backend nominates
//: the enemy with the most games and re-nominates as they lock), at which
//: point the page snaps back to that opponent, the actionable side.
let COUNTER_OPP;

function renderCounters(s) {
  const g = s.guide || {}, tables = g.counterTables || {};
  // Snap to the opponent's page whenever the surfaced opponent changes -- on
  // first sight of one, and again when a better one takes over. Done the moment
  // the id changes, not when the tables arrive: the guide reloads on a new
  // opponent, so its tables are briefly empty, and waiting for them would let a
  // manual "beats you" outlast the opponent it was chosen against.
  const opp = g.opponentId != null ? g.opponentId : null;
  if (opp !== COUNTER_OPP) {
    COUNTER_OPP = opp;
    if (opp != null) COUNTER_SIDE = 'them';
  }
  // Only one direction exists before an opponent is nominated.
  const side = tables[COUNTER_SIDE] ? COUNTER_SIDE
    : (tables.them ? 'them' : 'you');
  const sig = sigOf(g.state, side, tables);
  if (sig === COUNT_SIG) return;
  COUNT_SIG = sig;
  COUNTER_SIDE = side;

  const tb = tables[side];
  const me = (s.championName || t('c.you'));

  $('csegs').innerHTML = (tables.them || tables.you) ? `
    ${tables.them ? `<button class="mode" aria-pressed="${side === 'them'}"
        data-side="them">${t('c.beats', { name: esc(tables.them.name) })}</button>` : ''}
    ${tables.you ? `<button class="mode" aria-pressed="${side === 'you'}"
        data-side="you">${t('c.beats', { name: esc(tables.you.name || me) })}</button>` : ''}` : '';
  for (const b of $('csegs').querySelectorAll('.mode'))
    b.onclick = () => { COUNTER_SIDE = b.dataset.side; COUNT_SIG = ''; render(LAST); };

  if (!tb || !(tb.rows || []).length) {
    $('chead').innerHTML = '';
    noteEmpty('crows', g.state === 'loading', 'subj.counters',
              esc(t('c.none')), esc(t('c.none.text')));
    $('cnote').textContent = '';
    return;
  }

  // The client's position names, said the way the sentence wants them.
  const role = t({ top: 'role.top', jungle: 'role.jungle', middle: 'role.mid',
                   bottom: 'role.bot', utility: 'role.support' }[s.role] || 'role.lane');
  $('chead').innerHTML = `
    <span class="cic"></span>
    <span class="tnm">${t('c.head', { role: esc(role), name: esc(tb.name) })}</span>
    <span class="cfig">${esc(t('c.win'))}</span>
    <span class="cshare">${esc(t('c.share'))}</span>
    <span class="cgold">${esc(t('c.gold'))}</span>`;

  // The widest share on screen sets the bar's full length, so the bars
  // compare with each other rather than with an invisible 100%.
  // Your own champion sits at its true rank among the others, not pinned
  // to the end: "where do I actually sit" is answered by position.
  const rows = tb.rows.slice();
  if (tb.mine && !rows.some(r => r.championId === tb.mine.championId)) {
    const at = Math.min(Math.max((tb.mine.rank || rows.length + 1) - 1, 0), rows.length);
    rows.splice(at, 0, tb.mine);
  }
  const top = Math.max(...rows.map(r => r.pickShare || 0), 0.01);

  const line = (c, mine) => `
    <div class="trow crow ${mine ? 'me' : ''}" ${mine ? 'data-me="1"' : ''}
         title="${esc(c.name)} &mdash; ${plural(c.matches, 'games')}">
      <span class="cic"><img src="${esc(art(c.icon))}" alt=""></span>
      <span class="tnm">${esc(c.name)}${mine
        ? `<em>${esc(t('c.mine', { rank: c.rank, of: c.of }))}</em>` : ''}</span>
      <span class="cfig"><b>${fig(c.winRate, 2)}</b></span>
      <span class="cshare"><b>${fig(c.pickShare, 2)}</b>
        <span class="prop"><i style="width:${
          Math.round((c.pickShare || 0) / top * 100)}%"></i></span></span>
      <span class="cgold">${c.goldAt15 === undefined || c.goldAt15 === null ? '&mdash;'
        : (c.goldAt15 >= 0 ? '+' : '') + num(Math.round(c.goldAt15))
          + `<i>${esc(t('unit.gold'))}</i>`}</span>
    </div>`;

  freshen($('crows'));
  $('crows').innerHTML = rows.map(c => line(c, c === tb.mine)).join('');

  /* The note is computed, not written: the reason the top of a counter list
     is usually unactionable is that the champions on it are barely played in
     this lane, and that is a fact about the numbers beside it. */
  if (tb.mine) {
    const above = tb.rows.filter(r => r.winRate > tb.mine.winRate);
    const rare = above.filter(r => (r.pickShare || 0) < 2).length;
    const vars = { rare, above: plural(above.length, 'champs'),
                   mine: esc(tb.mine.name), name: esc(tb.name),
                   rank: tb.mine.rank, of: tb.mine.of };
    $('cnote').innerHTML = t(rare ? 'c.note.rare' : 'c.note.rank', vars)
      + (tb.source ? ' &middot; ' + srcline(tb.source) : '');
  } else {
    $('cnote').innerHTML = t('c.note.total', { total: tb.total })
      + (tb.source ? ' &middot; ' + srcline(tb.source) : '');
  }
}

function dismiss() {
  fetch('/api/window', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ close: 'picker' }),
  });
}
document.getElementById('dismiss').addEventListener('click', dismiss);
document.getElementById('mini').addEventListener('click', () => {
  fetch('/api/window', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ minimize: 'picker' }),
  });
});

/* The one-time elevation choice. Both answers resume the pending skin apply on
   the server; "auto" additionally installs the passwordless helper (one OS
   prompt). Hidden optimistically so the card does not linger for a poll. */
function chooseElevation(choice) {
  $('elevate').hidden = true;
  fetch('/api/elevation', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ choice }),
  });
}
$('e-auto').addEventListener('click', () => chooseElevation('auto'));
$('e-prompt').addEventListener('click', () => chooseElevation('prompt'));

/* First-run welcome. Both buttons clear it on the server; "Open settings"
   also asks the shell to raise the settings window. Hidden optimistically. */
function dismissWelcome(openSettings) {
  $('welcome').hidden = true;
  fetch('/api/welcome', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ openSettings: !!openSettings }),
  });
}
$('w-settings').addEventListener('click', () => dismissWelcome(true));
$('w-ok').addEventListener('click', () => dismissWelcome(false));

/* Tab moves between the views this mode has, which is what it is for here. The
   import row is the one place that also needs ordinary tabbing -- its button
   and two switches have to be reachable without a mouse -- so Tab steps into
   the row, walks it natively, and hands itself back to the view cycle on the
   way out. Nothing ever traps focus. */
function importControls() {
  const bar = $('ibar').hidden ? null : $('ibar');
  // A disabled button cannot take focus, so listing one leaves Tab pointing
  // at nothing: the import button is disabled for as long as an import is in
  // flight, and tabbing into the row during one dropped focus on the floor.
  const live = 'button:not([hidden]):not(:disabled)';
  return [...(bar ? bar.querySelectorAll(live) : [])];
}

/* What Tab walks through before it goes back to cycling views. Every page
   that holds a control or a scrolling table puts them here, so a filter chip
   and a table are reachable without a mouse; the tables are focusable so the
   arrow and page keys scroll them once Tab has arrived. */
const inView = sel => {
  const el = $(viewId(VIEW));
  return el && !el.hidden ? [...el.querySelectorAll(sel)] : [];
};
function viewControls() {
  if (VIEW === 'build') return importControls();
  if (VIEW === 'augments') return [...inView('.chip'), ...inView('.tbody')];
  if (VIEW === 'counters') return [...inView('.mode'), ...inView('.tbody')];
  if (VIEW === 'tiers') return inView('.tbody');
  if (VIEW === 'items') return inView('.guide');
  return [];
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    e.preventDefault();
    dismiss();
    return;
  }
  if (e.key === 'Tab') {
    const controls = viewControls();
    const at = controls.indexOf(document.activeElement);
    if (at >= 0) {
      // Inside the row: let the browser move, except off its far end, where
      // Tab goes back to being the view switch.
      if (at !== (e.shiftKey ? 0 : controls.length - 1)) return;
      document.activeElement.blur();
    } else if (controls.length) {
      e.preventDefault();
      controls[e.shiftKey ? controls.length - 1 : 0].focus();
      return;
    }
    e.preventDefault();
    const keys = TABS.map(tb => tb.key);
    const here = keys.indexOf(VIEW);
    showView(keys[(here + (e.shiftKey ? keys.length - 1 : 1)) % keys.length]);
    return;
  }
  // As many number keys as this mode has tabs, never a fixed three.
  if (e.key >= '1' && e.key <= String(Math.min(TABS.length, 9))) {
    const pick = TABS[+e.key - 1];
    if (pick) showView(pick.key);
    return;
  }
  if (e.key === 'i' && VIEW === 'build' && !$('ibar').hidden
      && (document.activeElement || {}).tagName !== 'SELECT') {
    e.preventDefault();
    runImport();
    return;
  }
  if (VIEW !== 'skin') return;
  if (!SKINS.length) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
  if (e.key === 'ArrowLeft')  { e.preventDefault(); step(-1); }
});
addEventListener('resize', () => { if (SKINS.length) mark(); });

addEventListener('resize', moveTabline);



poll();
</script>
