     they were missing, so a 64.86% over 37 games cannot read as the best
     option on the row. */
  const optBlock = (cap, rows) => !rows || !rows.length ? '' : `
    <div class="opt"><span class="cap">${cap}</span><div class="picks">` +
    rows.slice(0, 2).map(o => `<span class="pick ${o.matches < THIN ? 'thin' : ''}"
        title="${esc(o.name)} &mdash; ${num(o.matches)} games">
      <span class="it small"><img src="${esc(art(o.icon))}" alt=""></span>
      <span class="wr">${fig(o.winRate, 2)}</span>
      <span class="n">${num(o.matches)}</span></span>`).join('') + `</div></div>`;

  /* ARAM: the same options with their names, paid for by the lane row and
     the matchup switch this mode does not draw. An unnamed item is the same
     failure as an unnamed augment, and ARAM item choices are the less
     rehearsed of the two. */
  const namedOpts = (cap, rows) => !rows || !rows.length ? '' : `
    <div class="aoptrow"><span class="cap">${cap}</span>` +
    rows.slice(0, 2).map(o => `<span class="aopt ${o.matches < THIN ? 'thin' : ''}">
      <span class="it small" title="${esc(o.name)}"><img src="${esc(art(o.icon))}" alt=""></span>
      <span class="nm">${esc(o.name)}</span>
      <span class="wr">${fig(o.winRate, 2)}</span>
      <span class="n">${num(o.matches)}<i>games</i></span></span>`).join('') + `</div>`;

  const wide = q.roles === false;

  freshen(box);
  box.innerHTML = toggle + `
    <div class="split">
      <section class="block">
        ${bandHTML('Runes', runes)}
        <div class="trees">
          ${runes.primary ? treeHTML(runes.primary) : ''}
          ${runes.secondary ? treeHTML(runes.secondary) : ''}
        </div>
        <div class="shards">${shards}</div>
      </section>
      <section class="block">
        ${bandHTML('Skills', sk)}
        <div class="duo">
          <div class="spells">${(sp.spells || []).map(x =>
            `<img src="${esc(art(x.icon))}" alt="" title="${esc(x.name)}">`).join('')}</div>
          <div class="prio">${(sk.priority || []).join(' &rsaquo; ')}</div>
        </div>
        <div class="skills">${skillRows}</div>
      </section>
    </div>
    <section class="block">
      ${bandHTML('Items', b.core)}
      ${wide ? `
      <div class="items">${itemRow(b.start, 'small')}
        <span class="arrowto sep">|</span>${itemRow(b.core, '')}</div>
      <div class="aopts">
        ${namedOpts('Fourth', b.fourth)}${namedOpts('Fifth', b.fifth)}
        ${namedOpts('Sixth', b.sixth)}
      </div>` : `
      <div class="igrid">
        <div class="items">${itemRow(b.start, 'small')}
          <span class="arrowto sep">|</span>${itemRow(b.core, '')}</div>
        <div class="opts">
          ${optBlock('4th', b.fourth)}${optBlock('5th', b.fifth)}${optBlock('6th', b.sixth)}
        </div>
      </div>`}
    </section>
    ${g.source ? `<div class="gsrc">${srcline(g.source)}</div>` : ''}`;

  for (const btn of box.querySelectorAll('.mode')) {
    btn.onclick = () => { BUILD_MODE = btn.dataset.mode; GUIDE_SIG = ''; render(LAST); };
  }
}

/* Re-arms the stagger for content that has genuinely changed. Without the
   reflow the class is already present and the animation never restarts; and
   because every caller bails on an unchanged signature, a poll that changes
   nothing never reaches here.

   The class is then taken off again, which is the whole point: a CSS
   animation restarts every time its element comes back from display:none,
   and all five of these boxes live inside a view that is hidden when another
   tab is open. Leaving `fresh` on meant every return to the build, tier
   list, augments, items or counters page replayed the entrance -- the same
   thing the rail was doing, and it reads the same way: as though the page
   were being fetched again. The longest of these animations is 190ms after a
   95ms delay, so 400ms clears them all. */
const FRESH_T = new WeakMap();
function freshen(box) {
  box.classList.remove('fresh');
  void box.offsetWidth;
  box.classList.add('fresh');
  clearTimeout(FRESH_T.get(box));
  FRESH_T.set(box, setTimeout(() => box.classList.remove('fresh'), 400));
}

/* Arena is a different game: augments are chosen three times a match and
   change how a champion works, so they lead. Placement is the measure, not
   wins -- one team of four takes first, so a 50% win rate would be absurd. */
/* ═══ Arena ════════════════════════════════════════════════════════
   Three pages, because Arena asks three questions and none of them is the
   footer of another. In champ select: is this champion worth picking. In
   game: which of the three augments on offer to take. Beside both: what to
   buy. */

let AUG_FILTER = 'all', TIER_SIG = '', AUG_SIG = '', ITEM_SIG = '';

const RARITIES = ['prismatic', 'gold', 'silver'];

/* op.gg's numeric tier, shown as op.gg publishes it. Nothing in the payload
   maps 1 to 5 onto letters, so inventing an S/A/B scale would be dressing a
   rank up as a grade it never claimed to be. The rank column carries the
   ordering that the tier only bands. */
const tierClass = t => t == 1 ? 'hi' : t == 2 ? 's' : t == 3 ? 'mid' : 'lo';

/* The augment letters ARE derived here, from placement, so they get the
   letter treatment. Gold is spent only on the top band, so it stays scarce. */
const bandClass = t => t === 'S+' ? 'hi' : t === 'S' ? 's'
  : t === 'A' ? 'mid' : 'lo';

function renderArenaViews(s) {
  const g = s.guide || {};
  if ((s.queue || {}).source !== 'opgg') return;
  renderTiers(s, g);
  renderAugments(s, g);
  renderArenaItems(s, g);
}

/* The roster, as op.gg ranks it. Sorted by rank, with the champion being
   hovered found at its own place and scrolled to, so "is this worth picking"
   is answered by position rather than by a number beside a list. */
function renderTiers(s, g) {
  const t = g.tierList, rows = (t || {}).champions || [];
  const sig = sigOf(s.championId, g.state, t);
  if (sig === TIER_SIG) return;
  TIER_SIG = sig;

  $('thead').innerHTML = rows.length ? `
    <span class="tn rank">#</span><span class="tic"></span>
    <span class="tnm">Champion</span>
    <span class="tier">Tier</span>
    <span class="tn">1st</span><span class="tn">Top 3</span>
    <span class="tn">Place</span><span class="tn">Picked</span>` : '';

  if (!rows.length) {
    noteEmpty('trows', g.state === 'loading', 'the tier list',
              'No tier list', 'op.gg had nothing for this patch.');
    $('tnote').textContent = '';
    return;
  }

  const mine = s.championId;
  freshen($('trows'));
  $('trows').innerHTML = rows.map(c => `
    <div class="trow ${c.championId === mine ? 'me' : ''}"
         ${c.championId === mine ? 'data-me="1"' : ''}
         title="${esc(c.name)} &mdash; ${num(c.matches)} games, banned ${c.banRate}%">
      <span class="tn rank">${c.rank || ''}</span>
      <span class="tic round"><img src="${esc(art(c.icon))}" alt=""></span>
      <span class="tnm">${esc(c.name)}${c.championId === mine
        ? '<em>hovering</em>' : ''}</span>
      <span class="tier ${tierClass(c.tier)}">${c.tier == null ? '' : c.tier}</span>
      <span class="tn lead">${fig(c.firstRate)}</span>
      <span class="tn dim">${fig(c.topRate)}</span>
      <span class="tn dim">${c.avgFinish == null ? '&mdash;' : c.avgFinish.toFixed(2)}</span>
      <span class="tn dim">${fig(c.pickRate)}</span>
    </div>`).join('');

  // What the columns are measured against, said once, under them.
  $('tnote').innerHTML = 'Six teams of three, so an average place of <b>3.50</b>'
    + ' is the middle and a top 3 is the top half.'
    + ` <b>${rows.length}</b> champions played on patch ${esc(t.patch || '')}.`
    + (t.source ? ' &middot; ' + srcline(t.source) : '');

  const row = $('trows').querySelector('[data-me]');
  if (row) row.scrollIntoView({ block: 'center' });
}

/* All 45, in one ranked table. The rarity rides a hairline on the icon
   rather than a section heading, which is what lets them share a ranking;
   the chips narrow it to the pool you are actually choosing from. */
function renderAugments(s, g) {
  const all = g.augments || [];
  const sig = sigOf(g.state, AUG_FILTER, all);
  if (sig === AUG_SIG) return;
  AUG_SIG = sig;

  const counts = { all: all.length };
  for (const r of RARITIES) counts[r] = all.filter(a => a.rarity === r).length;

  $('achips').innerHTML = ['all'].concat(RARITIES).map(k => `
    <button class="chip" data-rarity="${k}" aria-pressed="${AUG_FILTER === k}">
      ${k === 'all' ? 'All' : k[0].toUpperCase() + k.slice(1)}
      <b>${counts[k] || 0}</b></button>`).join('')
    + '<span class="sort">by tier</span>';
  for (const b of $('achips').querySelectorAll('.chip'))
    b.onclick = () => { AUG_FILTER = b.dataset.rarity; AUG_SIG = ''; render(LAST); };

  $('ahead').innerHTML = all.length ? `
    <span class="tic"></span><span class="tnm">Augment</span>
    <span class="tier">Tier</span>
    <span class="tn">1st</span><span class="tn">Picked</span>` : '';

  if (!all.length) {
    noteEmpty('arows', g.state === 'loading', 'the augments',
              'No augment data', 'op.gg had nothing for this champion.');
    $('anote').textContent = '';
    return;
  }

  const rows = AUG_FILTER === 'all' ? all : all.filter(a => a.rarity === AUG_FILTER);
  freshen($('arows'));
  $('arows').innerHTML = rows.map(a => `
    <div class="trow" title="${esc(a.name)} &mdash; ${esc(a.rarity)}, ${
      num(a.matches)} games, finishes ${a.avgFinish} against a ${
      esc(a.rarity)} average of ${a.baseline}">
      <span class="tic r-${esc(a.rarity)}"><img src="${esc(art(a.icon))}" alt=""></span>
      <span class="tnm">${esc(a.name)}</span>
      ${a.tier ? `<span class="tier ${bandClass(a.tier)}">${a.tier}</span>`
        : `<span class="tier none" title="too few games to rate">${num(a.matches)}</span>`}
      <span class="tn">${fig(a.firstRate)}</span>
      <span class="tn dim">${fig(a.pickRate)}</span>
    </div>`).join('');

  // The letter is a claim about a pool, and the page has to say which pool.
  $('anote').innerHTML = 'Tier is average finish against the same rarity for'
    + ' this champion, so it means <b>best among ' + (AUG_FILTER === 'all'
      ? 'its own rarity' : esc(AUG_FILTER) + 's') + '</b>, not best in the game.'
    + ' Under <b>50</b> games the count is shown instead of a letter.'
    + (g.source ? ' &middot; ' + srcline(g.source) : '');
}

function renderArenaItems(s, g) {
  const items = g.arenaItems || {}, sk = g.arenaSkills || {};
  const sig = sigOf(g.state, items, sk);
  if (sig === ITEM_SIG) return;
  ITEM_SIG = sig;
  const box = $('aitems');

  if (!Object.keys(items).length) {
    noteEmpty('aitems', g.state === 'loading', 'the items',
              'No item data', 'op.gg had nothing for this champion.');
    return;
  }

  /* Named rows, not a strip of anonymous icons. op.gg publishes builds as
     sets rather than as one recommendation, so a row that is a combination
     spells the whole combination out and carries the first item's icon. */
  const list = (rows, limit) => (rows || []).slice(0, limit).map(r => {
    const name = (r.items || []).map(i => i.name).join(' › ');
    return `<div class="aoptrow"><span class="aopt"
        title="${esc(name)} &mdash; ${num(r.matches)} games">
      <span class="it small"><img src="${esc(art(r.icon))}" alt=""></span>
      <span class="nm">${esc(name)}</span>
      <span class="wr">${fig(r.firstRate)}</span>
      <span class="n">${fig(r.pickRate)}<i>picked</i></span>
    </span></div>`;
  }).join('');

  const section = (title, note, rows, limit) => !rows || !rows.length ? '' : `
    <section class="block">${bandHTML(title, null, note)}
      <div class="aopts">${list(rows, limit)}</div></section>`;

  freshen(box);
  box.innerHTML =
    // Round 2 is the one round op.gg's data and the game's structure agree
    // on, so it is the one round this page names.
    section('Prismatic', 'free anvil, round 2 · 1st place · picked',
            items.prismatic, 6)
    + section('Core build', '1st place · picked', items.core, 4)
    + section('Boots', '1st place · picked', items.boots, 3)
    + section('Late items', '1st place · picked', items.late, 5)
    + ((sk.priority || []).length ? `<section class="block">
        <div class="band"><h2>Skill max order</h2>
          <span class="wr">${fig(sk.firstRate)}</span>
          <span class="n">${num(sk.matches)} games · 1st place</span></div>
        <div class="prio">${(sk.priority || []).join(' &rsaquo; ')}</div>
      </section>` : '')
    + (g.source ? `<div class="gsrc">${srcline(g.source)}</div>` : '');
}

/* ═══ import: putting the build on screen into the client ═══════════
   The server resolves the build from the same state this page renders, so
   the only thing sent is which of the two it is showing. Everything else --
   which rune page to overwrite, whether spells are in scope -- is decided
   there, and comes back as one result to display. */

let IMPORT_BUSY = false, IMPORT_SEEN = 0, CHOICE = null, SAY_TIMER = 0;

function paintToggles() {
  $('ispells').setAttribute('aria-checked',
    String(SETTINGS.import_spells !== false));
  $('iauto').setAttribute('aria-checked', String(!!SETTINGS.auto_import));
}

async function flipSetting(button, name) {
  const next = button.getAttribute('aria-checked') !== 'true';
  // Painted before the round trip: this is a switch, and a switch that waits
  // on a fetch to move reads as a broken one.
  button.setAttribute('aria-checked', String(next));
  SETTINGS[name] = next;
  try {
    const r = await (await fetch('/api/settings', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ name, value: next }),
    })).json();
    if (r && r.settings) { SETTINGS = r.settings; paintToggles(); }
  } catch (e) { loadSettings(); }
}

function noteImport(text, bad) {
  const el = $('isay');
  clearTimeout(SAY_TIMER);
  el.textContent = text;
  el.classList.toggle('bad', !!bad);
  el.classList.toggle('in', !!text);
  // A failure is read; a success is only confirmed, so it goes sooner.
  if (text) SAY_TIMER = setTimeout(() => el.classList.remove('in'),
                                   bad ? 9000 : 4500);
}

function renderImport(s) {
  const g = s.guide || {}, bar = $('ibar');
  const arena = g.mode === 'arena';
  const ready = g.state === 'ready' && !!s.championId;
  bar.hidden = !ready;
  if (!ready) { closeChooser(); return; }

  // Arena publishes no runes and no spells, so the button is honest about
  // writing only the shop's item set there.
  $('igo').textContent = IMPORT_BUSY ? 'importing…'
    : arena ? 'Import items' : 'Import build';
  $('igo').disabled = IMPORT_BUSY;
  $('ispells').hidden = arena;

  // Auto-import has no caller to answer, so its outcome arrives here. Only a
  // genuinely new result opens anything: the same one arriving on every poll
  // must not reopen a chooser that was just cancelled, and a result the
  // server has dropped -- it does that when the champion changes -- takes its
  // question away with it.
  const done = s.import || {};
  if (done.at && done.at !== IMPORT_SEEN) {
    IMPORT_SEEN = done.at;
    showImport(done);
  } else if (!done.needsSlot) {
    closeChooser();
  }
}

function showImport(r) {
  if (r.needsSlot) {
    openChooser(r.pages || []);
    noteImport('all three rune pages are in use', true);
    return;
  }
  closeChooser();
  if (r.ok) {
    noteImport((r.dryRun ? 'would write ' : 'imported ')
               + ((r.done || []).join(' · ') || 'nothing'), false);
  } else {
    noteImport(r.error || 'import failed', true);
  }
}

async function runImport(replacePageId) {
  if (IMPORT_BUSY) return;
  IMPORT_BUSY = true;
  $('igo').disabled = true;
  $('igo').textContent = 'importing…';
  noteImport('', false);
  let r;
  try {
    r = await (await fetch('/api/import', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(replacePageId
        ? { what: 'all', mode: BUILD_MODE, confirmReplacePageId: replacePageId }
        : { what: 'all', mode: BUILD_MODE }),
    })).json();
  } catch (e) { r = { ok: false, error: 'the app did not answer' }; }
  IMPORT_BUSY = false;
  IMPORT_SEEN = r.at || IMPORT_SEEN;
  showImport(r);
  render(LAST);
}

/* The only destructive step in the app: making room means deleting a page
   that is not ours. It is asked in place, one page named at a time, and the
   confirm carries that page's name rather than the word "OK". */
function openChooser(pages) {
  const box = $('ichoose');
  if (!pages.length) { closeChooser(); return; }
  if (!pages.some(p => p.id === CHOICE)) {
    // The one in use is what the other importers overwrite, and it is the
    // one the player is least likely to be keeping for a different champion.
    CHOICE = (pages.find(p => p.current) || pages[0]).id;
  }
  const sig = pages.map(p => p.id).join(',');
  if (box.dataset.sig !== sig) {
    box.dataset.sig = sig;
    box.innerHTML =
      '<p>All three rune pages are in use. Choose the one Tibbers takes over.</p>'
      + '<div class="picks-pages">' + pages.map(p => `
        <button class="pgpick" data-id="${p.id}" data-name="${esc(p.name)}"
                aria-pressed="${p.id === CHOICE}">
          <b>${esc(p.name)}</b>
          <em>${esc(p.keystone || 'no keystone')}${p.current ? ' · in use now' : ''}</em>
        </button>`).join('') + '</div>'
      + '<div class="acts"><button class="igo named" id="iconfirm"></button>'
      + '<button class="tog" id="icancel">Cancel</button></div>';
    for (const b of box.querySelectorAll('.pgpick')) {
      b.onclick = () => { CHOICE = parseInt(b.dataset.id, 10); markChoice(box); };
    }
    $('iconfirm').onclick = () => { closeChooser(); runImport(CHOICE); };
    $('icancel').onclick = () => { closeChooser(); noteImport('', false); };
  }
  markChoice(box);
  box.hidden = false;
  // Reachable without a mouse from the moment it appears.
  if (!box.contains(document.activeElement))
    (box.querySelector('.pgpick[aria-pressed="true"]') || box).focus();
}

function markChoice(box) {
  let name = '';
  for (const b of box.querySelectorAll('.pgpick')) {
    const mine = parseInt(b.dataset.id, 10) === CHOICE;
    b.setAttribute('aria-pressed', String(mine));
    if (mine) name = b.dataset.name;
  }
  const confirm = $('iconfirm');
  if (confirm) confirm.textContent = 'Replace ' + name;
}

function closeChooser() {
  const box = $('ichoose');
  if (!box.hidden && box.contains(document.activeElement)) $('igo').focus();
  box.hidden = true;
}

$('igo').onclick = () => runImport(null);
$('ispells').onclick = () => flipSetting($('ispells'), 'import_spells');
$('iauto').onclick = () => flipSetting($('iauto'), 'auto_import');

/* ═══ counters ═════════════════════════════════════════════════════
   One question at a time. "What beats them" and "what beats you" are the
   same table with the subject swapped, so they are one table with a switch
   above it rather than two designs stacked down a page nobody scrolls.

   Your own champion is inserted at its true rank rather than exiled to a
   widget in the margin: "where do I actually sit" is a question about
   position, and only position answers it. */

let COUNTER_SIDE = 'them';

function renderCounters(s) {
  const g = s.guide || {}, tables = g.counterTables || {};
  // Only one direction exists before an opponent is nominated.
  const side = tables[COUNTER_SIDE] ? COUNTER_SIDE
    : (tables.them ? 'them' : 'you');
  const sig = sigOf(g.state, side, tables);
  if (sig === COUNT_SIG) return;
  COUNT_SIG = sig;
  COUNTER_SIDE = side;

  const t = tables[side];
  const me = (s.championName || 'you');

  $('csegs').innerHTML = (tables.them || tables.you) ? `
    ${tables.them ? `<button class="mode" aria-pressed="${side === 'them'}"
        data-side="them">Beats ${esc(tables.them.name)}</button>` : ''}
    ${tables.you ? `<button class="mode" aria-pressed="${side === 'you'}"
        data-side="you">Beats ${esc(tables.you.name || me)}</button>` : ''}` : '';
  for (const b of $('csegs').querySelectorAll('.mode'))
    b.onclick = () => { COUNTER_SIDE = b.dataset.side; COUNT_SIG = ''; render(LAST); };

  if (!t || !(t.rows || []).length) {
    $('chead').innerHTML = '';
    noteEmpty('crows', g.state === 'loading', 'counters',
              'No counter data', 'Lock a champion to see what beats it.');
    $('cnote').textContent = '';
    return;
  }

  const role = s.role ? s.role.replace('utility', 'support').replace('middle', 'mid')
                          .replace('bottom', 'bot') : 'your lane';
  $('chead').innerHTML = `
    <span class="cic"></span>
    <span class="tnm">${esc(role[0].toUpperCase() + role.slice(1))} picks,
      best against ${esc(t.name)}</span>
    <span class="cfig">Win</span>
    <span class="cshare">Pick share</span>
    <span class="cgold">Gold @15</span>`;

  // The widest share on screen sets the bar's full length, so the bars
  // compare with each other rather than with an invisible 100%.
  // Your own champion sits at its true rank among the others, not pinned
  // to the end: "where do I actually sit" is answered by position.
  const rows = t.rows.slice();
  if (t.mine && !rows.some(r => r.championId === t.mine.championId)) {
    const at = Math.min(Math.max((t.mine.rank || rows.length + 1) - 1, 0), rows.length);
    rows.splice(at, 0, t.mine);
  }
  const top = Math.max(...rows.map(r => r.pickShare || 0), 0.01);

  const line = (c, mine) => `
    <div class="trow crow ${mine ? 'me' : ''}" ${mine ? 'data-me="1"' : ''}
         title="${esc(c.name)} &mdash; ${num(c.matches)} games">
      <span class="cic"><img src="${esc(art(c.icon))}" alt=""></span>
      <span class="tnm">${esc(c.name)}${mine
        ? `<em>your pick &middot; ranked ${c.rank} of ${c.of}</em>` : ''}</span>
      <span class="cfig"><b>${fig(c.winRate, 2)}</b></span>
      <span class="cshare"><b>${fig(c.pickShare, 2)}</b>
        <span class="prop"><i style="width:${
          Math.round((c.pickShare || 0) / top * 100)}%"></i></span></span>
      <span class="cgold">${c.goldAt15 === undefined || c.goldAt15 === null ? '&mdash;'
        : (c.goldAt15 >= 0 ? '+' : '') + num(Math.round(c.goldAt15)) + '<i>g</i>'}</span>
    </div>`;

  freshen($('crows'));
  $('crows').innerHTML = rows.map(c => line(c, c === t.mine)).join('');

  /* The note is computed, not written: the reason the top of a counter list
     is usually unactionable is that the champions on it are barely played in
     this lane, and that is a fact about the numbers beside it. */
  if (t.mine) {
    const above = t.rows.filter(r => r.winRate > t.mine.winRate);
    const rare = above.filter(r => (r.pickShare || 0) < 2).length;
    $('cnote').innerHTML = (rare
      ? `<b>${rare}</b> of the ${above.length} above ${esc(t.mine.name)} are picked in`
        + ` under 2% of ${esc(t.name)}'s games.`
        + ` ${esc(t.mine.name)} sits ${t.mine.rank} of ${t.mine.of}.`
      : `${esc(t.mine.name)} ranks <b>${t.mine.rank}</b> of ${t.mine.of}`
        + ` against ${esc(t.name)}.`)
      + (t.source ? ' &middot; ' + srcline(t.source) : '');
  } else {
    $('cnote').innerHTML = `Win rate is the listed champion's, over`
      + ` <b>${t.total}</b> opponents played in this lane.`
      + (t.source ? ' &middot; ' + srcline(t.source) : '');
  }
}

function dismiss() {
  fetch('/api/window', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ close: 'picker' }),
  });
}
document.getElementById('dismiss').addEventListener('click', dismiss);

/* Tab moves between the views this mode has, which is what it is for here. The
   import row is the one place that also needs ordinary tabbing -- its button,
   two switches and the page chooser all have to be reachable without a mouse
   -- so Tab steps into the row, walks it natively, and hands itself back to
   the view cycle on the way out. Nothing ever traps focus. */
function importControls() {
  const box = $('ichoose').hidden ? null : $('ichoose');
  const bar = $('ibar').hidden ? null : $('ibar');
  // A disabled button cannot take focus, so listing one leaves Tab pointing
  // at nothing: the import button is disabled for as long as an import is in
  // flight, and tabbing into the row during one dropped focus on the floor.
  const live = 'button:not([hidden]):not(:disabled)';
  return [...(box ? box.querySelectorAll(live) : []),
          ...(bar ? bar.querySelectorAll(live) : [])];
}

/* What Tab walks through before it goes back to cycling views. Every page
   that holds a control or a scrolling table puts them here, so a filter chip
   and a table are reachable without a mouse; the tables are focusable so the
   arrow and page keys scroll them once Tab has arrived. */
const inView = sel => {
  const el = $(viewId(VIEW));
  return el && !el.hidden ? [...el.querySelectorAll(sel)] : [];
};
function viewControls() {
  if (VIEW === 'build') return importControls();
  if (VIEW === 'augments') return [...inView('.chip'), ...inView('.tbody')];
  if (VIEW === 'counters') return [...inView('.mode'), ...inView('.tbody')];
  if (VIEW === 'tiers') return inView('.tbody');
  if (VIEW === 'items') return inView('.guide');
  return [];
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    e.preventDefault();
    // A chooser open over the build is what Escape is about at that moment;
    // taking the window away instead would lose the question.
    if (!$('ichoose').hidden) { closeChooser(); noteImport('', false); return; }
    dismiss();
    return;
  }
  if (e.key === 'Tab') {
    const controls = viewControls();
    const at = controls.indexOf(document.activeElement);
    if (at >= 0) {
      // Inside the row: let the browser move, except off its far end, where
      // Tab goes back to being the view switch.
      if (at !== (e.shiftKey ? 0 : controls.length - 1)) return;
      document.activeElement.blur();
    } else if (controls.length) {
      e.preventDefault();
      controls[e.shiftKey ? controls.length - 1 : 0].focus();
      return;
    }
    e.preventDefault();
    const keys = TABS.map(t => t.key);
    const here = keys.indexOf(VIEW);
    showView(keys[(here + (e.shiftKey ? keys.length - 1 : 1)) % keys.length]);
    return;
  }
  // As many number keys as this mode has tabs, never a fixed three.
  if (e.key >= '1' && e.key <= String(Math.min(TABS.length, 9))) {
    const pick = TABS[+e.key - 1];
    if (pick) showView(pick.key);
    return;
  }
  if (e.key === 'i' && VIEW === 'build' && !$('ibar').hidden
      && (document.activeElement || {}).tagName !== 'SELECT') {
    e.preventDefault();
    // With the chooser open the answer is a page, not another attempt.
    if ($('ichoose').hidden) runImport(null);
    return;
  }
  if (VIEW !== 'skin') return;
  if (!SKINS.length) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
  if (e.key === 'ArrowLeft')  { e.preventDefault(); step(-1); }
});
addEventListener('resize', () => { if (SKINS.length) mark(); });

addEventListener('resize', moveTabline);



poll();
</script>
</body>
